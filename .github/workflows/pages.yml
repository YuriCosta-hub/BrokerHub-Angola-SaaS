name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm --filter @workspace/brokerhub-angola run build
        env:
          PORT: "5000"
          BASE_PATH: /${{ github.event.repository.name }}/
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      - name: SPA fallback for GitHub Pages
        run: |
          PUB=artifacts/brokerhub-angola/dist/public
          cp "$PUB/index.html" "$PUB/404.html"
          touch "$PUB/.nojekyll"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/brokerhub-angola/dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
